        function setLanguage(lang) {
            const dict = translations[lang];
            document.documentElement.lang = lang;
            document.getElementById('page-label').innerText = dict.label;
            document.getElementById('page-title').innerText = dict.title;
            document.getElementById('content').innerHTML = dict.content;
            document.getElementById('back-link').innerText = dict.backLink;

            document.querySelectorAll('.lang-btn').forEach((btn) => {
                btn.classList.remove('bg-brand-cyan', 'text-slate-950');
                btn.classList.add('text-brand-cyan');
            });

            const activeBtn = Array.from(document.querySelectorAll('.lang-btn')).find((btn) => btn.innerText === (lang === 'es' ? 'Español' : lang === 'en' ? 'English' : lang === 'pt' ? 'Português' : 'Русский'));
            if (activeBtn) {
                activeBtn.classList.add('bg-brand-cyan', 'text-slate-950');
                activeBtn.classList.remove('text-brand-cyan');
            }
        }

        setLanguage('es');
    </script>
